{% set name = "PyDTMC" %}
{% set version = "10.1.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name.lower() }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pydtmc/pydtmc-{{ version }}.tar.gz
  sha256: 44e84e53064b1f57cc0d739727f8fcb7d4ea394f4f8976093e22e80f089fa8e4

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - matplotlib-base
    - networkx
    - numpy
    - scipy

test:
  imports:
    - {{ name.lower() }}
  source_files:
    - tests/
  requires:
    - pytest
    - python {{ python_min }}
  commands:
    - pytest tests/

about:
  home: https://github.com/TommasoBelluzzo/{{ name }}
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: A framework for discrete-time Markov chains analysis.
  description: PyDTMC is a full-featured, lightweight library for discrete-time Markov chains analysis. It provides classes and functions for creating, manipulating, simulating and visualizing markovian stochastic processes.
  doc_url: https://{{ name.lower() }}.readthedocs.io/
  doc_source_url: https://github.com/TommasoBelluzzo/{{ name }}/blob/master/docs/source/index.rst
  dev_url: https://github.com/TommasoBelluzzo/{{ name }}

extra:
  recipe-maintainers:
    - TommasoBelluzzo
